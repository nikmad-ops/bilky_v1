name: Bilky Status

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram chat id requesting status'
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Authorize Telegram chat
        id: auth
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${REQUEST_CHAT_ID}" != "${AUTHORIZED_CHAT_ID}" ]; then
            echo "Unauthorized Telegram chat_id."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        if: steps.auth.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm config set audit false
          npm config set fund false
          npm config set fetch-retries 1
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 5000
          if ! timeout 90s npm install --prefer-offline --no-audit --no-fund; then
            echo "First npm install failed/timed out; retrying once..."
            timeout 90s npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Read Bilky weekly status
        id: run_status
        if: steps.auth.outputs.allowed == 'true'
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run status

      - name: Notify Telegram on workflow infrastructure failure
        if: ${{ failure() && steps.auth.outputs.allowed == 'true' && steps.run_status.outcome != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"❌ Bilky STATUS. ERROR: GitHub workflow failed before status execution\"}" || true

      - name: Upload Bilky diagnostics
        if: always() && steps.auth.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-status-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14
