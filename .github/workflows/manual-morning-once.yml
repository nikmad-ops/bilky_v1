name: Bilky | One-time Morning Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-morning-once.yml'

jobs:
  nik:
    uses: ./.github/workflows/workshift-v4.1-master.yml
    with:
      client_id: nik
      client_label: Nik
      airtop_profile: bilky-nik
      github_environment: client-nik
      action: morning
      mode: manual
      browser_provider: scrapeless
    secrets: inherit

  alena:
    uses: ./.github/workflows/workshift-v4.1-master.yml
    with:
      client_id: alena
      client_label: Alena
      airtop_profile: bilky-alena
      github_environment: client-alena
      action: morning
      mode: manual
      browser_provider: scrapeless
    secrets: inherit

  irakli:
    uses: ./.github/workflows/workshift-v4.1-master.yml
    with:
      client_id: irakli
      client_label: Irakli
      airtop_profile: bilky-irakli
      github_environment: client-irakli
      action: morning
      mode: manual
      browser_provider: scrapeless
    secrets: inherit
