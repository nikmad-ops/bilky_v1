name: Irakli v4.1 Pre-Cutover Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/irakli-v4.1-precutover.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: client-irakli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets without printing values
        shell: bash
        env:
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in BILKY_NIF BILKY_PASSWORD AIRTOP_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ADMIN_TELEGRAM_BOT_TOKEN ADMIN_TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read-only Bilky validation for Irakli
        env:
          REQUEST_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLIENT_NAME: Irakli
          AIRTOP_PROFILE_NAME: bilky-irakli
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
          NON_WORKING_DAYS_JSON: '[]'
        run: npm run status

      - name: Show validation result
        if: success()
        run: cat status-result.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irakli-v4.1-precutover-${{ github.run_id }}
          path: |
            diagnostics/
            status-result.txt
            status-error.txt
          if-no-files-found: ignore
          retention-days: 7
