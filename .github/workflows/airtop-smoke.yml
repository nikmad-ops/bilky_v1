name: Airtop Safe Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Airtop safe smoke test
        env:
          AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
        run: npm run airtop-smoke

      - name: Verify safe result
        run: |
          set -euo pipefail
          test -s airtop-smoke-result.json
          jq -e '.success == true' airtop-smoke-result.json >/dev/null
          jq -e '.field1Ok == true' airtop-smoke-result.json >/dev/null
          jq -e '.field2Ok == true' airtop-smoke-result.json >/dev/null
          jq -e '.loginClicked == false' airtop-smoke-result.json >/dev/null
          jq -e '.workshiftClicked == false' airtop-smoke-result.json >/dev/null

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtop-safe-smoke-${{ github.run_id }}
          path: airtop-smoke-result.json
          if-no-files-found: ignore
          retention-days: 7
