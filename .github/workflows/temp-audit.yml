name: Bilky TEMP Audit
on:
  push:
    paths:
      - '.github/workflows/temp-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax check
        run: |
          node --check src/bilky-core.js
          node --check src/workshift.js
          node --check src/status.js
