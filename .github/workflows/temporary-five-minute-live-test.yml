name: Bilky TEMP Live Test Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Select live action window
        id: window
        shell: bash
        run: |
          set -euo pipefail

          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DATE=$(TZ=Europe/Madrid date +%F)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          echo "Madrid date: ${MADRID_DATE}"
          echo "Madrid time: ${MADRID_TIME}"
          echo "Madrid weekday: ${MADRID_DOW}"

          if [ "${MADRID_DOW}" -gt 5 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Temporary recovery window for today while testing.
          if [ "${MADRID_DATE}" = "2026-09-21" ] && \
             [ "${MADRID_TIME}" -ge 0755 ] && \
             [ "${MADRID_TIME}" -le 0930 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "action=morning" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normal personal morning window.
          if [ "${MADRID_TIME}" -ge 0755 ] && \
             [ "${MADRID_TIME}" -le 0830 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "action=morning" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normal personal evening window.
          if [ "${MADRID_TIME}" -ge 1750 ] && \
             [ "${MADRID_TIME}" -le 1830 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "action=evening" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: npm install

      - name: Run REAL Bilky workshift
        if: steps.window.outputs.run == 'true'
        env:
          ACTION: ${{ steps.window.outputs.action }}
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run workshift

      - name: Upload Bilky diagnostics
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-temp-live-test-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
