name: Telegram Webhook Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/telegram-webhook-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: client-nik
    steps:
      - name: Check admin Telegram webhook
        shell: bash
        env:
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          DATA=$(curl --fail --silent --show-error "https://api.telegram.org/bot${ADMIN_TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$DATA" | jq '{ok, result: {url: .result.url, pending_update_count: .result.pending_update_count, last_error_date: .result.last_error_date, last_error_message: .result.last_error_message, max_connections: .result.max_connections, has_custom_certificate: .result.has_custom_certificate}}'

      - name: Compare client and admin bots
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for kind in CLIENT ADMIN; do
            if [ "$kind" = "CLIENT" ]; then TOKEN="$TELEGRAM_BOT_TOKEN"; else TOKEN="$ADMIN_TELEGRAM_BOT_TOKEN"; fi
            ME=$(curl --fail --silent --show-error "https://api.telegram.org/bot${TOKEN}/getMe")
            WH=$(curl --fail --silent --show-error "https://api.telegram.org/bot${TOKEN}/getWebhookInfo")
            USERNAME=$(echo "$ME" | jq -r '.result.username // ""')
            URL=$(echo "$WH" | jq -r '.result.url // ""')
            PENDING=$(echo "$WH" | jq -r '.result.pending_update_count // 0')
            LASTERR=$(echo "$WH" | jq -r '.result.last_error_message // ""')
            echo "$kind username=$USERNAME"
            echo "$kind webhook=$URL"
            echo "$kind pending=$PENDING"
            echo "$kind last_error=$LASTERR"
          done

      - name: Send outbound diagnostic
        shell: bash
        env:
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --request POST             --header 'Content-Type: application/json'             --data "$(jq -nc --arg chat_id "$ADMIN_TELEGRAM_CHAT_ID" --arg text "Bilky v4.1 diagnostic: Telegram outbound OK." '{chat_id:$chat_id,text:$text}')"             "https://api.telegram.org/bot${ADMIN_TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null
          echo "OUTBOUND_OK"
