name: Bilky TEMP Personal Live Test 11:50

on:
  schedule:
    - cron: '5 10 21 9 *'

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Guard exact test date
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          MADRID_DATE=$(TZ=Europe/Madrid date +%F)
          echo "Madrid date: ${MADRID_DATE}"
          if [ "${MADRID_DATE}" != "2026-09-21" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install

      - name: Run REAL personal Bilky morning
        if: steps.guard.outputs.run == 'true'
        env:
          ACTION: morning
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run workshift

      - name: Upload Bilky diagnostics
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-temp-personal-live-test-1150-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
