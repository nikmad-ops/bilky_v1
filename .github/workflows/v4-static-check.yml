name: Bilky v4 Static Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v4-static-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/production-core.js
      - run: node --check src/dom-audit.js

# v4 check
