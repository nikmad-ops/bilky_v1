name: Scheduler Registration Test

on:
  push:
    branches:
      - main

  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Heartbeat
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC:"
          date -u
          echo "Runner time:"
          date
