name: Scheduler Registration Test

on:
  push:
    branches:
      - main

schedule:
  - cron: '12,17 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Heartbeat
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC:"
          date -u
          echo "Local runner time:"
          date
