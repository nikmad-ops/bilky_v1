name: Bilky | Workshift

on:
  workflow_call:
    inputs:
      client_id:
        required: true
        type: string
      client_label:
        required: true
        type: string
      airtop_profile:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      action:
        required: true
        type: string
      mode:
        required: true
        type: string
      browser_provider:
        required: false
        type: string
        default: airtop
    secrets:
      BILKY_NIF:
        required: true
      BILKY_PASSWORD:
        required: true
      AIRTOP_API_KEY:
        required: false
      SCRAPELESS_API_KEY:
        required: false
      BROWSERLESS_TOKEN:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
      ADMIN_TELEGRAM_BOT_TOKEN:
        required: false
      ADMIN_TELEGRAM_CHAT_ID:
        required: false

  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client id'
        required: true
        default: 'nik'
        type: choice
        options:
          - nik
          - alena
          - irakli
      client_label:
        description: 'Client label'
        required: true
        default: 'Nik'
        type: string
      airtop_profile:
        description: 'Airtop profile'
        required: true
        default: 'bilky-nik'
        type: string
      github_environment:
        description: 'GitHub Environment holding client secrets'
        required: true
        default: 'client-nik'
        type: string
      action:
        description: 'morning or evening'
        required: true
        type: choice
        options:
          - morning
          - evening
      mode:
        description: 'scheduled or manual'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - scheduled
      browser_provider:
        description: 'Browser provider'
        required: true
        default: 'browserless'
        type: choice
        options:
          - browserless
          - scrapeless
          - airtop

concurrency:
  group: bilky-v4-${{ inputs.client_id }}-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  workshift:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: ${{ inputs.github_environment }}

    steps:
      - name: Safety gate
        shell: bash
        env:
          CLIENT_ID: ${{ inputs.client_id }}
          ACTION: ${{ inputs.action }}
          MODE: ${{ inputs.mode }}
          BROWSER_PROVIDER: ${{ inputs.browser_provider || 'airtop' }}
        run: |
          set -euo pipefail

          [[ "${CLIENT_ID}" =~ ^(nik|alena|irakli)$ ]] || { echo "Invalid client_id"; exit 1; }
          [[ "${ACTION}" =~ ^(morning|evening)$ ]] || { echo "Invalid action"; exit 1; }
          [[ "${MODE}" =~ ^(manual|scheduled)$ ]] || { echo "Invalid mode"; exit 1; }
          [[ "${BROWSER_PROVIDER}" =~ ^(airtop|scrapeless|browserless)$ ]] || { echo "Invalid browser_provider"; exit 1; }

          DOW=$(TZ=Europe/Madrid date +%u)
          [ "${DOW}" -le 5 ] || { echo "Blocked: weekend"; exit 1; }

          if [ "${MODE}" = "scheduled" ]; then
            NOW=$(TZ=Europe/Madrid date +%H%M)
            if [ "${ACTION}" = "morning" ]; then
              [ "${NOW}" -ge 0755 ] && [ "${NOW}" -le 0930 ] || { echo "Outside morning window 07:55-09:30 Europe/Madrid"; exit 1; }
            else
              [ "${NOW}" -ge 1630 ] && [ "${NOW}" -le 1805 ] || { echo "Outside evening window 16:30-18:05 Europe/Madrid"; exit 1; }
            fi
          fi

      - name: Checkout v4.1 master
        uses: actions/checkout@v4
        with:
          repository: nikmad-ops/bilky_v1
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Execute one shift with 3-cycle recovery