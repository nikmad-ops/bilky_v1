name: Bilky v4 Nik Canary Wrapper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workshift-v4-nik-canary.yml'

jobs:
  call-master:
    uses: ./.github/workflows/workshift-v4-master.yml
    with:
      client_id: nik
      client_label: Nik
      airtop_profile: bilky-nik
      action: morning
      mode: manual
    secrets:
      BILKY_NIF: ${{ secrets.BILKY_NIF }}
      BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
      AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
