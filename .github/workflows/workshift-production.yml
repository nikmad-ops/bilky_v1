name: Bilky Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'morning or evening'
        required: true
        type: choice
        options:
          - morning
          - evening
      execute:
        description: 'Allow Bilky click operations'
        required: true
        default: false
        type: boolean
      target_date:
        description: 'Optional YYYY-MM-DD target date'
        required: false
        default: ''
        type: string
      allow_historical_target:
        description: 'Allow yesterday as target date for controlled testing'
        required: true
        default: false
        type: boolean
      bypass_time_guard:
        description: 'Bypass normal morning/evening time window for controlled testing'
        required: true
        default: false
        type: boolean

jobs:
  workshift:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Safety gate
        id: safety
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: ${{ inputs.execute }}
          TARGET_DATE: ${{ inputs.target_date }}
          ALLOW_HISTORICAL_TARGET: ${{ inputs.allow_historical_target }}
          BYPASS_TIME_GUARD: ${{ inputs.bypass_time_guard }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Requested action: ${ACTION}"
          echo "Execute: ${EXECUTE}"
          echo "Target date: ${TARGET_DATE:-<today>}"
          echo "Historical allowed: ${ALLOW_HISTORICAL_TARGET}"
          echo "Bypass time guard: ${BYPASS_TIME_GUARD}"

          if [ "${EXECUTE}" != "true" ]; then
            echo "Execution disabled. No Bilky browser session will be started."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DATE=$(TZ=Europe/Madrid date +%F)
          MADRID_YESTERDAY=$(TZ=Europe/Madrid date -d 'yesterday' +%F)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          echo "Madrid date: ${MADRID_DATE}"
          echo "Madrid time: ${MADRID_TIME}"
          echo "Madrid weekday: ${MADRID_DOW}"

          if [ "${BYPASS_TIME_GUARD}" = "true" ]; then
            if [ -z "${TARGET_DATE}" ]; then
              echo "Blocked: bypass_time_guard requires explicit target_date."
              exit 1
            fi

            if [ "${TARGET_DATE}" = "${MADRID_YESTERDAY}" ]; then
              if [ "${ALLOW_HISTORICAL_TARGET}" != "true" ]; then
                echo "Blocked: yesterday requires allow_historical_target=true."
                exit 1
              fi
            elif [ "${TARGET_DATE}" != "${MADRID_DATE}" ]; then
              echo "Blocked: controlled test target may only be today or yesterday."
              exit 1
            fi

            echo "Controlled test mode approved."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${TARGET_DATE}" ] && [ "${TARGET_DATE}" != "${MADRID_DATE}" ]; then
            echo "Blocked: production mode may target only today."
            exit 1
          fi

          if [ "${MADRID_DOW}" -gt 5 ]; then
            echo "Blocked: weekend."
            exit 1
          fi

          case "${ACTION}" in
            morning)
              if [ "${MADRID_TIME}" -lt 0745 ] || [ "${MADRID_TIME}" -gt 0820 ]; then
                echo "Blocked: morning execution outside 07:45-08:20 Europe/Madrid."
                exit 1
              fi
              ;;
            evening)
              if [ "${MADRID_TIME}" -lt 1750 ] || [ "${MADRID_TIME}" -gt 1830 ]; then
                echo "Blocked: evening execution outside 17:50-18:30 Europe/Madrid."
                exit 1
              fi
              ;;
            *)
              echo "Blocked: invalid action ${ACTION}."
              exit 1
              ;;
          esac

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.safety.outputs.allowed == 'true'
        run: npm install

      - name: Run Bilky workshift
        if: steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: 'true'
          TARGET_DATE: ${{ inputs.target_date }}
          ALLOW_HISTORICAL_TARGET: ${{ inputs.allow_historical_target }}
          BYPASS_TIME_GUARD: ${{ inputs.bypass_time_guard }}
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run workshift
