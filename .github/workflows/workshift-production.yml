name: Bilky Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'morning or evening'
        required: true
        type: choice
        options:
          - morning
          - evening
      execute:
        description: 'Allow Bilky click operations'
        required: true
        default: false
        type: boolean

jobs:
  workshift:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Safety gate
        id: safety
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Requested action: ${ACTION}"
          echo "Execute: ${EXECUTE}"

          if [ "${EXECUTE}" != "true" ]; then
            echo "Execution disabled. No Bilky browser session will be started."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DATE=$(TZ=Europe/Madrid date +%F)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          echo "Madrid date: ${MADRID_DATE}"
          echo "Madrid time: ${MADRID_TIME}"
          echo "Madrid weekday: ${MADRID_DOW}"

          if [ "${MADRID_DOW}" -gt 5 ]; then
            echo "Blocked: weekend."
            exit 1
          fi

          case "${ACTION}" in
            morning)
              if [ "${MADRID_TIME}" -lt 0745 ] || [ "${MADRID_TIME}" -gt 0820 ]; then
                echo "Blocked: morning execution outside 07:45-08:20 Europe/Madrid."
                exit 1
              fi
              ;;
            evening)
              if [ "${MADRID_TIME}" -lt 1750 ] || [ "${MADRID_TIME}" -gt 1830 ]; then
                echo "Blocked: evening execution outside 17:50-18:30 Europe/Madrid."
                exit 1
              fi
              ;;
            *)
              echo "Blocked: invalid action ${ACTION}."
              exit 1
              ;;
          esac

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        if: steps.safety.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm config set audit false
          npm config set fund false
          npm config set fetch-retries 1
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 5000
          if ! timeout 90s npm install --prefer-offline --no-audit --no-fund; then
            echo "First npm install failed/timed out; retrying once..."
            timeout 90s npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Run Bilky workshift
        id: run_workshift
        if: steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run workshift

      - name: Notify Telegram on workflow infrastructure failure
        if: ${{ failure() && steps.safety.outputs.allowed == 'true' && steps.run_workshift.outcome != 'failure' }}
        env:
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"❌ Bilky ${ACTION}. ERROR: GitHub workflow failed before Bilky execution\"}" || true
