name: Bilky Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'morning or evening'
        required: true
        type: choice
        options:
          - morning
          - evening
      execute:
        description: 'Allow Bilky click operations'
        required: true
        default: false
        type: boolean

jobs:
  workshift:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Safety gate
        id: safety
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${EXECUTE}" != "true" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          if [ "${MADRID_DOW}" -gt 5 ]; then
            echo "Blocked: weekend."
            exit 1
          fi

          case "${ACTION}" in
            morning)
              if [ "${MADRID_TIME}" -lt 0755 ] || [ "${MADRID_TIME}" -gt 0815 ]; then
                echo "Blocked: morning execution outside 07:55-08:15 Europe/Madrid."
                exit 1
              fi
              ;;
            evening)
              if [ "${MADRID_TIME}" -lt 1615 ] || [ "${MADRID_TIME}" -gt 1635 ]; then
                echo "Blocked: evening execution outside 16:15-16:35 Europe/Madrid."
                exit 1
              fi
              ;;
            *)
              echo "Blocked: invalid action ${ACTION}."
              exit 1
              ;;
          esac

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.safety.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.safety.outputs.allowed == 'true'
        run: npm install

      - name: Run Bilky workshift
        id: bilky
        if: steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        shell: bash
        run: |
          set -u

          rm -f run-result.json run-error.txt run-committed.json
          SERIES_START_EPOCH=$(date +%s)

          for SLOT in 1 2 3 4 5; do
            echo "===== TIME SLOT ${SLOT}/5 ====="

            if npm run workshift; then
              echo "Bilky completed successfully in slot ${SLOT}/5."
              exit 0
            fi

            if [ -f run-committed.json ]; then
              echo "HTTP 200 commit marker found. Refusing any further retry to avoid duplicate clocking."
              exit 1
            fi

            if [ "${SLOT}" -lt 5 ]; then
              if [ "${ACTION}" = "morning" ]; then WINDOW_END=0815; else WINDOW_END=1635; fi

              NEXT_SLOT_EPOCH=$((SERIES_START_EPOCH + SLOT * 300))
              NEXT_SLOT_HHMM=$(TZ=Europe/Madrid date -d "@${NEXT_SLOT_EPOCH}" +%H%M)

              if [ "${NEXT_SLOT_HHMM}" -gt "${WINDOW_END}" ]; then
                echo "Next fixed slot ${NEXT_SLOT_HHMM} is outside the allowed ${ACTION} window ending at ${WINDOW_END}. Stopping."
                break
              fi

              NOW_EPOCH=$(date +%s)
              WAIT_SECONDS=$((NEXT_SLOT_EPOCH - NOW_EPOCH))

              if [ "${WAIT_SECONDS}" -gt 0 ]; then
                echo "Slot ${SLOT}/5 failed before commit. Waiting ${WAIT_SECONDS}s until the next fixed 5-minute slot."
                sleep "${WAIT_SECONDS}"
              else
                echo "Next fixed slot time already reached; continuing immediately."
              fi

              rm -f run-error.txt
            fi
          done

          echo "Bilky failed in all 5 time slots."
          exit 1

      - name: Telegram success
        if: success() && steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Europe/Madrid date +%d.%m.%Y)
          FACT=$(jq -r '.fact // empty' run-result.json 2>/dev/null || true)
          DURATION=$(jq -r '.duration // empty' run-result.json 2>/dev/null || true)
          FACT_PARSE_ERROR=$(jq -r '.factParseError // false' run-result.json 2>/dev/null || true)

          if [ "${ACTION}" = "morning" ]; then
            if [ "${FACT_PARSE_ERROR}" = "true" ] || [ -z "${FACT}" ]; then
              MESSAGE="✅ Bilky ${DATE}: Morning recorded (HTTP 200). Fact unavailable"
            else
              MESSAGE="✅ Bilky ${DATE}: Morning. Fact: ${FACT:0:5}"
            fi
          else
            if [ "${FACT_PARSE_ERROR}" = "true" ] || [ -z "${FACT}" ]; then
              MESSAGE="✅ Bilky ${DATE}: Evening recorded (HTTP 200). Fact unavailable"
            else
              MESSAGE="✅ Bilky ${DATE}: Evening. Fact: ${FACT:0:5}"
            fi
            if [ -n "${DURATION}" ]; then
              MESSAGE="${MESSAGE}"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${TELEGRAM_CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

      - name: Telegram failure
        if: failure() && steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Europe/Madrid date +%d.%m.%Y)
          if [ "${ACTION}" = "morning" ]; then LABEL="Morning"; else LABEL="Evening"; fi

          if [ -f run-committed.json ]; then
            MESSAGE="⚠️ Bilky ${DATE}: ${LABEL}. HTTP 200 accepted, but result parsing/reporting failed. No retry was performed."
          else
            MESSAGE="❌ Bilky ${DATE}: ${LABEL}. ERROR"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${TELEGRAM_CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

      - name: Upload Bilky diagnostics
        if: always() && steps.safety.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-workshift-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            run-result.json
            run-error.txt
            run-committed.json
          if-no-files-found: ignore
          retention-days: 14
\n'"Full working day: ${DURATION}"
            fi
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${TELEGRAM_CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

      - name: Telegram failure
        if: failure() && steps.safety.outputs.allowed == 'true'
        env:
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Europe/Madrid date +%d.%m.%Y)
          if [ "${ACTION}" = "morning" ]; then LABEL="Morning"; else LABEL="Evening"; fi

          if [ -f run-committed.json ]; then
            MESSAGE="⚠️ Bilky ${DATE}: ${LABEL}. HTTP 200 accepted, but result parsing/reporting failed. No retry was performed."
          else
            MESSAGE="❌ Bilky ${DATE}: ${LABEL}. ERROR"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${TELEGRAM_CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

      - name: Upload Bilky diagnostics
        if: always() && steps.safety.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-workshift-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            run-result.json
            run-error.txt
            run-committed.json
          if-no-files-found: ignore
          retention-days: 14
