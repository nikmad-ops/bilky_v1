name: Bilky Production
run-name: Bilky ${{ inputs.action }} attempt ${{ inputs.attempt }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'morning or evening'
        required: true
        type: choice
        options:
          - morning
          - evening
      attempt:
        description: 'attempt number 1..5'
        required: true
        type: number
      request_id:
        description: 'scheduler request id'
        required: true
        type: string
      execute:
        description: 'allow Bilky click operations'
        required: true
        default: false
        type: boolean

concurrency:
  group: bilky-production-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  workshift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Safety gate
        id: safety
        env:
          ACTION: ${{ inputs.action }}
          ATTEMPT: ${{ inputs.attempt }}
          EXECUTE: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail

          [ "${EXECUTE}" = "true" ] || { echo "Blocked: execute=false"; exit 1; }
          [[ "${ATTEMPT}" =~ ^[1-5]$ ]] || { echo "Blocked: invalid attempt ${ATTEMPT}"; exit 1; }

          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          [ "${MADRID_DOW}" -le 5 ] || { echo "Blocked: weekend"; exit 1; }

          case "${ACTION}" in
            morning)
              if [ "${MADRID_TIME}" -lt 0755 ] || [ "${MADRID_TIME}" -gt 0825 ]; then
                echo "Blocked: morning outside 07:55-08:25 Europe/Madrid"
                exit 1
              fi
              ;;
            evening)
              if [ "${MADRID_TIME}" -lt 2050 ] || [ "${MADRID_TIME}" -gt 2110 ]; then
                echo "Blocked: evening outside TEMP FINAL TEST 20:50-21:10 Europe/Madrid"
                exit 1
              fi
              ;;
            *)
              echo "Blocked: invalid action ${ACTION}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bilky workshift
        id: bilky
        env:
          ACTION: ${{ inputs.action }}
          ATTEMPT: ${{ inputs.attempt }}
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          npm run workshift

          test -s run-result.json

          SUCCESS=$(jq -r '.success // false' run-result.json)
          STATUS=$(jq -r '.status // empty' run-result.json)

          [ "${SUCCESS}" = "true" ] || { echo "run-result is not successful"; exit 1; }
          case "${STATUS}" in
            clicked|already_done) ;;
            *) echo "Unexpected run-result status: ${STATUS}"; exit 1 ;;
          esac

          if [ "${STATUS}" = "clicked" ]; then
            HTTP_STATUS=$(jq -r '.httpStatus // empty' run-result.json)
            [ "${HTTP_STATUS}" = "200" ] || { echo "Clicked without HTTP 200 proof"; exit 1; }
            test -s run-committed.json
          fi

      - name: Telegram success
        if: success()
        env:
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(TZ=Europe/Madrid date +%d.%m.%Y)
          STATUS=$(jq -r '.status' run-result.json)
          FACT=$(jq -r '.fact // empty' run-result.json)
          DURATION=$(jq -r '.duration // empty' run-result.json)
          HTTP_STATUS=$(jq -r '.httpStatus // empty' run-result.json)

          if [ "${ACTION}" = "morning" ]; then
            LABEL="Morning"
          else
            LABEL="Evening"
          fi

          if [ "${STATUS}" = "clicked" ]; then
            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "Refusing Telegram success without HTTP 200"
              exit 1
            fi
          fi

          if [ "${STATUS}" = "already_done" ]; then
            if [ -n "${FACT}" ]; then
              MESSAGE="✅ Bilky ${DATE}: ${LABEL} already recorded. Fact: ${FACT:0:5}"
            else
              MESSAGE="✅ Bilky ${DATE}: ${LABEL} already recorded. Fact unavailable"
            fi
          elif [ -n "${FACT}" ]; then
            MESSAGE="✅ Bilky ${DATE}: ${LABEL}. Fact: ${FACT:0:5}"
          else
            MESSAGE="✅ Bilky ${DATE}: ${LABEL} recorded (HTTP 200). Fact unavailable"
          fi

          if [ -n "${DURATION}" ]; then
            MESSAGE="${MESSAGE}"$'\n'"Full working day: ${DURATION}"
          fi

          curl --fail --silent --show-error             --request POST             --header 'Content-Type: application/json'             --data "$(jq -nc --arg chat_id "${TELEGRAM_CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')"             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilky-workshift-${{ github.run_id }}
          path: |
            diagnostics/
            run-result.json
            run-error.txt
            run-committed.json
          if-no-files-found: ignore
          retention-days: 14
