name: Alena Telegram Webhook Readonly Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/alena-telegram-webhook-readonly.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: client-alena
    steps:
      - name: Inspect Telegram bot and webhook without sending messages
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          ME=$(curl --fail --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          WH=$(curl --fail --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$ME" | jq '{ok, username: .result.username, id: .result.id}'
          echo "$WH" | jq '{ok, url: .result.url, pending_update_count: .result.pending_update_count, last_error_date: .result.last_error_date, last_error_message: .result.last_error_message, max_connections: .result.max_connections, ip_address: .result.ip_address, has_custom_certificate: .result.has_custom_certificate}'
