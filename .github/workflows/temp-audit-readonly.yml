name: Bilky TEMP Audit Readonly
on:
  push:
    paths:
      - '.github/workflows/temp-audit-readonly.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run evening path safely
        env:
          ACTION: evening
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: npm run workshift
      - name: Show result
        if: always()
        run: |
          test -f run-result.json && cat run-result.json || true
          test -f run-error.txt && cat run-error.txt || true
