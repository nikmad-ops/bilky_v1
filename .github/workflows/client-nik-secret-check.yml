name: Client Nik Environment Secret Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/client-nik-secret-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: client-nik
    steps:
      - name: Check secret availability without printing values
        shell: bash
        env:
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          AIRTOP_API_KEY: ${{ secrets.AIRTOP_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in BILKY_NIF BILKY_PASSWORD AIRTOP_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ADMIN_TELEGRAM_BOT_TOKEN ADMIN_TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          done
          exit "$missing"
