name: Bilky Evening Recovery Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/evening-recovery-once.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: One-time safety gate
        shell: bash
        run: |
          set -euo pipefail
          MADRID_DATE=$(TZ=Europe/Madrid date +%F)
          MADRID_TIME=$(TZ=Europe/Madrid date +%H%M)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)

          echo "Madrid date: ${MADRID_DATE}"
          echo "Madrid time: ${MADRID_TIME}"
          echo "Madrid weekday: ${MADRID_DOW}"

          if [ "${MADRID_DATE}" != "2026-09-04" ]; then
            echo "Blocked: recovery is valid only for 2026-09-04."
            exit 1
          fi

          if [ "${MADRID_DOW}" -gt 5 ]; then
            echo "Blocked: weekend."
            exit 1
          fi

          if [ "${MADRID_TIME}" -lt 2000 ] || [ "${MADRID_TIME}" -gt 2100 ]; then
            echo "Blocked: recovery allowed only 20:00-21:00 Europe/Madrid."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run evening recovery
        env:
          ACTION: evening
          EXECUTE: 'true'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run workshift
